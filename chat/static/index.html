<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO-101 Robot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f0f;
    color: #e5e5e5;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 220px;
    min-width: 220px;
    background: #111;
    border-right: 1px solid #222;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  #sidebar h1 {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .status-group { display: flex; flex-direction: column; gap: 8px; }
  .status-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #555; }

  .status-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #aaa;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #333; flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.on  { background: #22c55e; box-shadow: 0 0 6px #22c55e66; }
  .dot.off { background: #ef4444; }
  .dot.unknown { background: #666; }

  .motor-list {
    font-size: 11px; color: #555; font-family: monospace;
    display: flex; flex-direction: column; gap: 2px;
    padding-left: 16px;
  }
  .motor-row { display: flex; justify-content: space-between; }
  .motor-row.active { color: #888; }

  .new-chat-btn {
    margin-top: auto;
    padding: 8px 12px;
    background: #1d4ed8;
    border: none; border-radius: 6px;
    color: #fff; font-size: 13px;
    cursor: pointer; transition: background 0.2s;
  }
  .new-chat-btn:hover { background: #2563eb; }

  /* ── Chat area ── */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #1d4ed8;
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.claude {
    align-self: flex-start;
    background: #1e1e1e;
    color: #e5e5e5;
    border: 1px solid #2a2a2a;
    border-bottom-left-radius: 3px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: #555;
    font-size: 12px;
    border: none;
    padding: 4px 0;
  }

  /* inline code */
  .msg code {
    background: #2a2a2a;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 12px;
  }

  .typing-indicator {
    align-self: flex-start;
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    border-bottom-left-radius: 3px;
    padding: 10px 16px;
    display: none;
    gap: 4px;
    align-items: center;
  }
  .typing-indicator.visible { display: flex; }
  .typing-indicator span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #555; animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* ── Input bar ── */
  #input-bar {
    border-top: 1px solid #1e1e1e;
    padding: 16px 28px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: #0f0f0f;
  }

  #input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #e5e5e5;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    resize: none;
    outline: none;
    max-height: 140px;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  #input:focus { border-color: #444; }
  #input::placeholder { color: #444; }

  #send-btn {
    width: 38px; height: 38px;
    border-radius: 8px;
    background: #1d4ed8;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
  }
  #send-btn:hover { background: #2563eb; }
  #send-btn:disabled { background: #1a2a4a; cursor: default; }
  #send-btn svg { width: 16px; height: 16px; fill: #fff; }

  /* Teleop badge */
  .teleop-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: #22c55e;
    background: #0f2010; border: 1px solid #1a4020;
    border-radius: 20px; padding: 3px 10px;
  }
  .teleop-badge.off { color: #888; background: transparent; border-color: #2a2a2a; }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <h1>SO-101</h1>

  <div class="status-group">
    <div class="status-label">Arms</div>
    <div class="status-row">
      <div class="dot unknown" id="dot-follower"></div>
      <span id="label-follower">Follower</span>
    </div>
    <div class="motor-list" id="motors-follower"></div>
    <div class="status-row" style="margin-top:4px">
      <div class="dot unknown" id="dot-leader"></div>
      <span id="label-leader">Leader</span>
    </div>
  </div>

  <div class="status-group">
    <div class="status-label">Teleoperation</div>
    <div id="teleop-badge" class="teleop-badge off">
      <span class="dot" id="dot-teleop"></span>
      <span id="label-teleop">Stopped</span>
    </div>
  </div>

  <div class="status-group">
    <div class="status-label">Tools</div>
    <div style="font-size:12px; color:#555; line-height:1.7">
      check motors<br>
      scan ports<br>
      start / stop teleop<br>
      calibrate ranges<br>
      record dataset
    </div>
  </div>

  <button class="new-chat-btn" onclick="newChat()">New chat</button>
</div>

<!-- Chat -->
<div id="chat-area">
  <div id="messages">
    <div class="msg system">Connecting to robot assistant…</div>
  </div>
  <div class="typing-indicator" id="typing">
    <span></span><span></span><span></span>
  </div>
  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="Message SO-101 assistant…"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  let sessionId = localStorage.getItem("so101_session") || null;
  let streaming = false;

  // ── Session ────────────────────────────────────────────────────────
  async function initSession() {
    const resp = await fetch("/session/new", { method: "POST" });
    sessionId = resp.headers.get("X-Session-Id") || Date.now().toString(36);
    localStorage.setItem("so101_session", sessionId);
    clearMessages();
    await readStream(resp, appendClaudeMsg());
  }

  function newChat() {
    sessionId = null;
    localStorage.removeItem("so101_session");
    initSession();
  }

  // ── Messages ───────────────────────────────────────────────────────
  function clearMessages() {
    document.getElementById("messages").innerHTML = "";
  }

  function appendMsg(cls, text = "") {
    const el = document.createElement("div");
    el.className = `msg ${cls}`;
    el.textContent = text;
    document.getElementById("messages").appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
    return el;
  }

  function appendClaudeMsg() {
    return appendMsg("claude");
  }

  function showTyping(on) {
    const t = document.getElementById("typing");
    t.classList.toggle("visible", on);
    if (on) t.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  // ── Stream reader ──────────────────────────────────────────────────
  async function readStream(resp, msgEl) {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          if (ev.type === "text") {
            msgEl.textContent += ev.content;
            msgEl.scrollIntoView({ behavior: "smooth", block: "end" });
          }
        } catch { /* skip malformed */ }
      }
    }
  }

  // ── Send message ───────────────────────────────────────────────────
  async function sendMessage() {
    if (streaming) return;
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    document.getElementById("send-btn").disabled = true;

    appendMsg("user", text);
    showTyping(true);
    streaming = true;

    const claudeEl = appendClaudeMsg();

    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      showTyping(false);
      await readStream(resp, claudeEl);
    } catch (e) {
      claudeEl.textContent = "Error: " + e.message;
    } finally {
      streaming = false;
      document.getElementById("send-btn").disabled = false;
      input.focus();
    }
  }

  // ── Status polling ─────────────────────────────────────────────────
  async function pollStatus() {
    try {
      const [motorResp, teleopResp] = await Promise.all([
        fetch("/status"),
        fetch("/teleop/status"),
      ]);
      const motor  = await motorResp.json();
      const teleop = await teleopResp.json();

      // Follower (motor server tracks follower)
      const connected = motor.connected;
      setDot("dot-follower", connected ? "on" : "off");
      document.getElementById("label-follower").textContent =
        connected ? `Follower (${Object.keys(motor.positions || {}).length}/6)` : "Follower — no power?";

      const mList = document.getElementById("motors-follower");
      mList.innerHTML = "";
      if (connected) {
        const names = ["shoulder_pan","shoulder_lift","elbow_flex","wrist_flex","wrist_roll","gripper"];
        for (const n of names) {
          const v = (motor.positions || {})[n];
          const row = document.createElement("div");
          row.className = "motor-row" + (v !== undefined ? " active" : "");
          row.innerHTML = `<span>${n.replace("_"," ")}</span><span>${v ?? "—"}</span>`;
          mList.appendChild(row);
        }
      }

      // Leader — we don't poll it separately yet
      setDot("dot-leader", "unknown");

      // Teleop
      const running = teleop.running;
      const badge = document.getElementById("teleop-badge");
      badge.className = "teleop-badge" + (running ? "" : " off");
      setDot("dot-teleop", running ? "on" : "unknown");
      document.getElementById("label-teleop").textContent = running ? "Running" : "Stopped";
    } catch { /* server may not be up yet */ }
  }

  function setDot(id, state) {
    const el = document.getElementById(id);
    el.className = "dot " + state;
  }

  // ── Input auto-resize & enter to send ─────────────────────────────
  const inputEl = document.getElementById("input");
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Boot ───────────────────────────────────────────────────────────
  initSession();
  pollStatus();
  setInterval(pollStatus, 3000);
</script>
</body>
</html>
